[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsnd"
version = "0.1.0"
description = "Temporal semantic novelty decomposition research package."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.2,<2.4",
    "pyarrow>=15,<18",
    "scipy>=1.11,<1.14",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.3,<4.6",
    "gensim>=4.3.3,<4.4",
    "netcal>=1.3.5,<1.4",
    "networkx>=3.2,<4",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.7.5,<3.8",
    "tqdm>=4.66,<5",
    "requests>=2.31,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
text = ["spacy>=3.7,<3.8"]
encoders = ["sentence-transformers>=3.0,<3.2"]
survival = ["pycox>=0.3.0,<0.4"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D"]
# ANN401: Any is intentional in the reflective evaluator. D107: __init__ docstrings
# are covered by the class docstring.
ignore = ["ANN401", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ANN"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "adapters",
    "gensim.*",
    "joblib",
    "netcal.*",
    "networkx",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "pycox.*",
    "scipy",
    "scipy.*",
    "sklearn.*",
    "torch",
    "torch.*",
    "torchtuples",
    "yaml",
]
ignore_missing_imports = true
